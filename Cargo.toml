[workspace]
members = [
    "jetstreamer-firehose",
    "jetstreamer-horizon",
    "jetstreamer-node",
    "jetstreamer-plugin",
    "jetstreamer-utils",
]

[workspace.package]
edition = "2024"
version = "0.7.0"
authors = ["sam0x17", "anza-team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/anza-xyz/jetstreamer"
documentation = "https://docs.rs/jetstreamer/latest"
keywords = ["solana", "geyser", "jetstreamer", "firehose", "transaction"]

[package]
name = "jetstreamer"
description = "High-throughput Solana transaction ledger streaming and plugin framework suitable for research and backfilling"
keywords.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
s3-backend = ["jetstreamer-firehose/s3-backend"]
verify-transaction-signatures = ["jetstreamer-firehose/verify-transaction-signatures"]

[workspace.dependencies]
jetstreamer-firehose = { path = "jetstreamer-firehose", version = "0.7.0" }
jetstreamer-plugin = { path = "jetstreamer-plugin", version = "0.7.0" }
jetstreamer-utils = { path = "jetstreamer-utils", version = "0.7.0" }
jetstreamer-node = { path = "jetstreamer-node", version = "0.7.0" }
jetstreamer-horizon = { path = "jetstreamer-horizon", version = "0.7.0" }
tokio = "1"
futures-util = { version = "0", default-features = false }
futures = "0"
log = "0"
lencode = { version = "1.2.1", features = ["solana", "std"] }
once_cell = "1"
serde_json = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
reqwest = { version = "0.13", default-features = false }
anyhow = { version = "1", default-features = false }
tar = "0.4"
env_logger = "0.11"
base64 = "0.22"
bincode = "1"
serial_test = "4"
criterion = { version = "0.5", features = ["html_reports"] }
wincode = "0.5.5"
bs58 = { version = "0", default-features = false }
cbor = "0"
cid = "0"
colored = "2"
const-hex = "1"
crc = "3"
crossbeam-channel = { version = "0", default-features = false }
crossbeam-utils = { version = "0", default-features = false }
fnv = { version = "1", default-features = false }
url = { version = "2", default-features = false }
multihash = { version = "0", default-features = false }
prost = { package = "prost", version = "0.14", default-features = false }
protobuf-src = "1"
serde = { version = "1", default-features = false }
serde_cbor = "0"
agave-geyser-plugin-interface = "=4.2.0"
agave-fs = "=4.2.0"
agave-logger = "=4.2.0"
agave-snapshots = "=4.2.0"
solana-address = ">=2.6.1,<2.7.0"
solana-account = ">=4.3.1,<4.4.0"
solana-hash = ">=4.4.0,<4.6.0"
solana-blake3-hasher = "=3.1.0"
solana-clock = ">=3.0.1,<3.2.0"
solana-epoch-rewards-hasher = "=3.1.0"
solana-keccak-hasher = "=3.1.0"
solana-pubkey = ">=4.2.0,<4.3.0"
solana-signature = { version = ">=3.4.1,<3.5.0", default-features = false }
solana-accounts-db = "=4.2.0"
solana-entry = "=4.2.0"
solana-ledger = "=4.2.0"
solana-geyser-plugin-manager = { version = "=4.2.0", features = ["agave-unstable-api"] }
solana-rpc = "=4.2.0"
solana-unified-scheduler-pool = { version = "=4.2.0", features = ["agave-unstable-api"] }
solana-runtime = "=4.2.0"
solana-runtime-transaction = "=4.2.0"
solana-storage-proto = "=4.2.0"
solana-message = ">=4.2.3,<4.5.0"
solana-transaction = ">=4.1.4,<4.2.0"
solana-account-decoder-client-types = "=4.2.0"
solana-transaction-error = ">=3.3.1,<3.4.0"
solana-instruction-error = ">=2.4.0,<2.5.0"
solana-transaction-status = "=4.2.0"
solana-sdk-ids = "3.1.0"
solana-reward-info = ">=6.2.0,<6.3.0"
solana-svm = "=4.2.0"
solana-svm-timings = "=4.2.0"
solana-sysvar = ">=4.0.0,<4.2.0"
solana-transaction-context = "=4.2.0"
solana-system-interface = "3.2.0"
solana-cpi = "3.1.0"
solana-genesis-utils = { version = "=4.2.0", features = ["agave-unstable-api"] }
sha2 = "0.10"
tonic = { version = "0", default-features = false }
tonic-build = "0"
zstd = { version = "0", default-features = false }
thousands = "0"
tokio-stream = { version = "0", default-features = false }
rangemap = "1"
rseek = "0.4"
ripget = "0.3"
rayon = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
ahash = "0.8"
dashmap = "6"
clickhouse = { version = "0.15", default-features = false }
interprocess = { version = "2", features = ["tokio"] }
ctrlc = "3"
indoc = "2"
tempfile = "3"
libc = "0"
aws-credential-types = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
aws-types = "1"

[dependencies]
# Same allocator choice (and reason) as jetstreamer-node: glibc malloc's
# handling of huge short-lived allocations under many threads costs kernel
# time and never returns memory; jemalloc's decay does. Applies to both the
# main CLI and horizon_pipeline binaries.
tikv-jemallocator = { version = "0.6", features = [
    "unprefixed_malloc_on_supported_platforms",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
agave-logger.workspace = true
log.workspace = true
jetstreamer-firehose.workspace = true
jetstreamer-horizon.workspace = true
jetstreamer-plugin.workspace = true
jetstreamer-utils.workspace = true
url.workspace = true
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"
sysinfo = "0.33"
solana-sysvar.workspace = true
solana-blake3-hasher.workspace = true
solana-epoch-rewards-hasher.workspace = true
solana-keccak-hasher.workspace = true

[dev-dependencies]
clickhouse.workspace = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

[patch.crates-io]
# lencode 1.2.1 still pins the Solana 3 type graph. This copy uses its upstream
# v4 adapter from 7a0b1ea4acacaf31f1391d60ba32e4ae01373a8c with Agave 4.2 constraints.
lencode = { path = "vendor/lencode" }
solana-program-runtime = { path = "vendor/solana-program-runtime" }
solana-svm = { path = "vendor/solana-svm" }
solana-runtime = { path = "vendor/solana-runtime-4.2.0" }
